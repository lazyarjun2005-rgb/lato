name: Release Lato

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate installer versions
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME}"
          shell_version="$(sed -n 's/^VERSION="\([^"]*\)"$/\1/p' scripts/install.sh)"
          powershell_version="$(sed -n "s/^\$Version = '\([^']*\)'$/\1/p" scripts/install.ps1)"
          test "$shell_version" = "$expected" || {
            echo "scripts/install.sh targets $shell_version, expected $expected" >&2
            exit 1
          }
          test "$powershell_version" = "$expected" || {
            echo "scripts/install.ps1 targets $powershell_version, expected $expected" >&2
            exit 1
          }

      - name: Test
        run: go test ./... -count=1

      - name: Vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Derive release version from Git tag
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "Releasing ${GITHUB_REF_NAME}"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          if [ "${GOOS}" = "windows" ]; then
            go build -trimpath -ldflags "-X lato/internal/version.Version=${VERSION}" -o "dist/lato-${GOOS}-${GOARCH}.exe" .
          else
            go build -trimpath -ldflags "-X lato/internal/version.Version=${VERSION}" -o "dist/lato-${GOOS}-${GOARCH}" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lato-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: lato-*
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum lato-* > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/lato-*
            dist/checksums.txt
